# CloudPanel / Nginx: incluir las dos primeras directivas dentro de `http {}`
# y las restantes dentro del bloque `server {}` de lmcadev.com.
# Ajusta los valores según las métricas reales antes de una campaña de tráfico.

limit_req_zone $binary_remote_addr zone=portfolio_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_connections:10m;

limit_req zone=portfolio_per_ip burst=30 nodelay;
limit_conn portfolio_connections 20;
limit_req_status 429;

# Los assets estáticos se benefician de caché y reducen el impacto de bots.
location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|avif|ico|woff2?)$ {
  try_files $uri =404;
  expires 7d;
  add_header Cache-Control "public, max-age=604800, immutable";
}
