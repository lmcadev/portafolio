name: Deploy React App (No Docker Hub)

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Configurar Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: npm

    - name: Instalar dependencias y construir app Vite
      run: |
        npm ci --ignore-scripts
        npm audit --omit=dev --audit-level=high
        npm run build

    - name: Verificar contenido de carpeta dist/
      run: |
        if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
          echo "La carpeta dist está vacía o no fue generada."
          exit 1
        fi
        echo "Contenido de dist:"
        ls -l dist

    - name: Subir carpeta dist/ al VPS (CloudPanel)
      uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        source: "dist/*"
        target: "/home/${{ secrets.VPS_USER }}/htdocs/lmcadev.com/"
        strip_components: 1
        overwrite: true

    - name: Establecer permisos correctos
      uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd ~/htdocs/lmcadev.com
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          echo "✅ Despliegue completado en https://lmcadev.com"
